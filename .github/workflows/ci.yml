name: CI
on:
  push:
    branches: ["**"]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: garimpa_test }
        ports: ["54329:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4   # versão vem de packageManager no package.json
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm --filter garimpa-api test
        env: { DATABASE_URL_TEST: "postgres://postgres:postgres@127.0.0.1:54329/garimpa_test" }
      - run: pnpm --filter garimpa-web build
      - run: pnpm --filter garimpa-web build:demo
