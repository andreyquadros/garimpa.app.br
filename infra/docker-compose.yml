# Pepita Social no KVM 8 via Dokploy (Compose). Caddy/Traefik do Dokploy termina o TLS e aponta o domínio para garimpa:8787.
# Variáveis: defina no painel do Dokploy (ou .env ao lado deste arquivo) as mesmas de ../.env.example.
services:
  garimpa-db:
    image: postgis/postgis:18-3.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: garimpa
      POSTGRES_USER: garimpa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}
      TZ: America/Porto_Velho
    volumes:
      # Postgres 18: a imagem guarda os dados em /var/lib/postgresql/18/docker e o volume monta o diretório pai.
      # Montar em .../data, como no 16, faz o banco subir vazio, fora do volume.
      - garimpa-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U garimpa -d garimpa"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Cache das leituras públicas (ADR-0006): sem volume, porque perder os dados só esfria o cache.
  # volatile-lru despeja só chaves com prazo (dados); as versões dos grupos não têm EX e nunca saem.
  # Persistência desligada de propósito: um RDB/AOF antigo ressuscitaria versões velhas.
  # Sem `ports`: só a rede interna do compose enxerga o Redis.
  garimpa-cache:
    image: redis:8.8.3-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?defina REDIS_PASSWORD}
    command:
      - sh
      - -c
      - exec redis-server --requirepass "$$REDIS_PASSWORD" --maxmemory 256mb --maxmemory-policy volatile-lru --save "" --appendonly no
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10

  garimpa:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    restart: unless-stopped
    depends_on:
      garimpa-db:
        condition: service_healthy
      garimpa-cache:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 8787
      DATABASE_URL: postgres://garimpa:${POSTGRES_PASSWORD}@garimpa-db:5432/garimpa
      REDIS_URL: redis://:${REDIS_PASSWORD}@garimpa-cache:6379/0
      SESSION_SECRET: ${SESSION_SECRET:?defina SESSION_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      # Avisos no aparelho (ADR-0007): sem as três o push fica desligado e a lista dentro do app continua.
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      ALLOW_DEV_LOGIN: "false"
      PUBLIC_URL: ${PUBLIC_URL:-https://garimpa.incubadora.cloud}
      UPLOAD_DIR: /data/uploads
      SERVE_WEB_DIR: /app/web/dist
      TRUST_PROXY: "true"
      TILES_URL: ${TILES_URL:-https://tile.openstreetmap.org/{z}/{x}/{y}.png}
      TILES_FALLBACK_URL: ${TILES_FALLBACK_URL:-https://tile.openstreetmap.org/{z}/{x}/{y}.png}
    volumes:
      - garimpa-uploads:/data/uploads
    expose:
      - "8787"
    # Dokploy: Domains → garimpa.incubadora.cloud → container port 8787 (HTTPS automático)

  # Backup diário do banco para fora do VPS (mesma rotina do Traccar). Ajuste o destino rclone.
  garimpa-backup:
    image: postgres:18-alpine
    restart: unless-stopped
    depends_on:
      garimpa-db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - garimpa-backups:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          pg_dump -h garimpa-db -U garimpa -d garimpa -Fc -f /backups/garimpa-$(date +%F).dump && \
          find /backups -name 'garimpa-*.dump' -mtime +14 -delete
          sleep 86400
        done

volumes:
  garimpa-pgdata:
  garimpa-uploads:
  garimpa-backups:
