<svg xmlns="http://www.w3.org/2000/svg" width="180" height="180" viewBox="0 0 180 180" role="img" aria-labelledby="pin-pulse-title pin-pulse-desc"><title id="pin-pulse-title">Local encontrado</title><desc id="pin-pulse-desc">Pulso de localização; animação CSS de 2,4 s com alternativa estática para movimento reduzido.</desc><style>.ring-one,.ring-two{transform-origin:90px 83px;animation:pin-pulse 2.4s ease-out infinite}.ring-two{animation-delay:1.2s}@keyframes pin-pulse{0%{transform:scale(.7);opacity:.6}100%{transform:scale(2.2);opacity:0}}@media(prefers-reduced-motion:reduce){.motion,.motion-alt,.ring-one,.ring-two,.spark,.rise{animation:none!important}.ring-one,.ring-two{opacity:.16!important}.motion{opacity:1!important}}</style><circle class="ring-one" cx="90" cy="83" r="29" fill="none" stroke="#187B56" stroke-width="2"/><circle class="ring-two" cx="90" cy="83" r="29" fill="none" stroke="#187B56" stroke-width="2"/><g transform="translate(51 33) scale(0.78)"><defs><mask id="pulse-cut" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="100"><rect width="100" height="100" fill="white"/><path d="M65 23H56V28C52.5 23.8 47.7 22 41.7 22C29 22 20 31.2 20 43.9C20 56.7 28.7 65.2 41 65.2C47.4 65.2 52.9 62.8 56 58.7V64.1C56 75 42.5 77.4 32.1 69.7L27.9 77.5C40.8 87.4 65 81.7 65 64.9V23ZM56 43.8C56 51.7 50.9 56.8 43.1 56.8C35.4 56.8 29.9 51.5 29.9 43.8C29.9 36.1 35.4 30.6 43.1 30.6C50.9 30.6 56 36.1 56 43.8Z" transform="translate(15 5) scale(.8)" fill="black" fill-rule="evenodd"/></mask></defs><path d="M50 4C27.91 4 10 21.91 10 44C10 63.77 30.69 83.07 46.57 96.63Q50 99.59 53.43 96.63C69.31 83.07 90 63.77 90 44C90 21.91 72.09 4 50 4Z" fill="#187B56" mask="url(#pulse-cut)"/></g></svg>
