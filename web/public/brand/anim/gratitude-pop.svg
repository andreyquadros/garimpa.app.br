<svg xmlns="http://www.w3.org/2000/svg" width="200" height="180" viewBox="0 0 200 180" role="img" aria-labelledby="gratitude-pop-title gratitude-pop-desc"><title id="gratitude-pop-title">Obrigado pela ajuda!</title><desc id="gratitude-pop-desc">Pepita de gratidão com pequeno salto; use uma vez após agradecer.</desc><style>.motion{transform-origin:100px 88px;animation:coin-pop 2.8s cubic-bezier(.2,.8,.2,1) infinite}.spark{animation:coin-spark 2.8s ease-in-out infinite}@keyframes coin-pop{0%,100%{transform:translate(36px,24px) scale(.9)}20%{transform:translate(36px,12px) scale(1.06)}38%,78%{transform:translate(36px,24px) scale(1)}}@keyframes coin-spark{0%,100%{opacity:.2}25%,70%{opacity:1}}@media(prefers-reduced-motion:reduce){.motion,.motion-alt,.ring-one,.ring-two,.spark,.rise{animation:none!important}.ring-one,.ring-two{opacity:.16!important}.motion{opacity:1!important}}</style><g class="motion" transform="translate(36 24)"><defs><clipPath id="gratitude-clip"><path d="M31 34Q35 22 49 19L76 15Q89 13 99 29L111 51Q121 65 111 82L96 103Q85 115 66 112L37 105Q21 101 18 82L19 61Q19 45 31 34Z"/></clipPath></defs><path d="M31 34Q35 22 49 19L76 15Q89 13 99 29L111 51Q121 65 111 82L96 103Q85 115 66 112L37 105Q21 101 18 82L19 61Q19 45 31 34Z" fill="#F3B749"/><g clip-path="url(#gratitude-clip)"><path d="m17 81 25-34 29 19-34 39-20-24Z" fill="#D9982F"/><path d="m31 34 40-7 28 2-29 37-28-19-11-13Z" fill="#FFE3A4"/><path d="m70 66 29-37 20 38-28 14-21-15Z" fill="#F6CB6A"/><path d="m37 105 33-39 21 15 5 22-30 9-29-7Z" fill="#E7AA38"/><path d="m31 34 11 13 29-20 28 2-23-14-27 4-18 15Z" fill="#FFF0C7"/><path d="m91 81 28-14-8 15-15 21-5-22Z" fill="#C98825"/><path d="m42 47 28 19 21 15M70 66l1-39M70 66l-33 39" fill="none" stroke="#FCE5A4" stroke-width="2" opacity=".65"/></g><path d="M31 34Q35 22 49 19L76 15Q89 13 99 29L111 51Q121 65 111 82L96 103Q85 115 66 112L37 105Q21 101 18 82L19 61Q19 45 31 34Z" fill="none" stroke="#103D32" stroke-width="2.5" stroke-linejoin="round"/><path d="M48 31