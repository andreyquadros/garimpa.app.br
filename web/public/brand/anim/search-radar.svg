<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200" role="img" aria-labelledby="search-radar-title search-radar-desc"><title id="search-radar-title">Procurando perto de você</title><desc id="search-radar-desc">Radar de busca com varredura lenta; movimento reduzido mantém composição estática.</desc><style>.motion{transform-origin:100px 100px;animation:radar 4s linear infinite}.motion-alt{animation:signal 4s ease-in-out infinite}@keyframes radar{to{transform:rotate(360deg)}}@keyframes signal{0%,65%,100%{opacity:.2}40%{opacity:1}}@media(prefers-reduced-motion:reduce){.motion,.motion-alt,.ring-one,.ring-two,.spark,.rise{animation:none!important}.ring-one,.ring-two{opacity:.16!important}.motion{opacity:1!important}}</style><circle cx="100" cy="100" r="74" fill="#D7F46A" opacity=".2"/><g stroke="#187B56" stroke-width="1.5" opacity=".28" fill="none"><circle cx="100" cy="100" r="72"/><circle cx="100" cy="100" r="48"/><circle cx="100" cy="100" r="24"/><path d="M28 100h144M100 28v144"/></g><path class="motion" d="M100 100V28a72 72 0 0 1 62.35 36L100 100Z" fill="#187B56" opacity=".12"/><circle cx="100" cy="100" r="22" fill="#F6F5EE"/><circle cx="97" cy="97" r="9" stroke="#103D32" stroke-width="3" fill="none"/><path d="m104 104 7 7" stroke="#103D32" stroke-width="3" stroke-linecap="round"/><circle class="motion-alt" cx="142" cy="80" r="5" fill="#187B56"/></svg>
