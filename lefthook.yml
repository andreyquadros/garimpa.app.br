# Hooks locais (ADR-0004). O CI repete as mesmas verificações.
pre-commit:
  parallel: true
  jobs:
    - name: biome
      glob: "*.{ts,tsx,mjs,js,json,css}"
      run: pnpm exec biome check --write --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
      stage_fixed: true
    - name: typecheck-api
      glob: "api/**/*.ts"
      run: pnpm --filter garimpa-api typecheck
    - name: typecheck-web
      glob: "web/**/*.{ts,tsx}"
      run: pnpm --filter garimpa-web typecheck

commit-msg:
  jobs:
    - name: mensagem
      run: node scripts/commit-msg.mjs {1}
