# Hooks locais (ADR-0004). O CI repete as mesmas verificações.
# Chamam os binários locais, sem depender do pnpm no PATH. doublestar faz "api/**/*.ts" casar também api/x.ts.
glob_matcher: doublestar

pre-commit:
  parallel: true
  jobs:
    - name: biome
      glob: "**/*.{ts,tsx,mjs,js,json,jsonc,css,html}"
      run: ./node_modules/.bin/biome check --write --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
      stage_fixed: true
    - name: typecheck-api
      glob: "api/**/*.ts"
      run: ./api/node_modules/.bin/tsc -p api/tsconfig.json --noEmit
    - name: typecheck-web
      glob: "web/**/*.{ts,tsx}"
      run: ./web/node_modules/.bin/tsc -p web/tsconfig.json --noEmit

commit-msg:
  jobs:
    - name: mensagem
      run: node scripts/commit-msg.mjs {1}
